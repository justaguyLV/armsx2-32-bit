name: Android armeabi-v7a
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: platforms/android
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install NDK + CMake
        run: yes | sdkmanager "ndk;29.0.14206865" "cmake;3.31.6" >/dev/null || true
      - name: Make ninja keep going after errors
        run: |
          B=$ANDROID_HOME/cmake/3.31.6/bin
          mv $B/ninja $B/ninja.real
          printf '#!/bin/sh\nexec %s/ninja.real -k 0 "$@"\n' "$B" > $B/ninja
          chmod +x $B/ninja
      - name: Fetch shaderc deps
        run: python3 app/src/main/cpp/3rdparty/shaderc/utils/git-sync-deps
      - name: Rust target
        run: rustup target add armv7-linux-androideabi
      - name: Build debug APK
        shell: bash
        run: ./gradlew :app:assemblePlayDebug --stacktrace 2>&1 | tee /tmp/build.log
      - name: Publish log tail to buildlogs branch
        if: always()
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          mkdir /tmp/out
          grep -E "error:|CMake Error|undefined reference|fatal error" /tmp/build.log | sed 's#/home/runner/work/armsx2-32-bit/armsx2-32-bit/##' | cut -c1-260 | sort | uniq -c | sort -rn | head -250 > /tmp/out/errors.txt || true
          tail -n 120 /tmp/build.log > /tmp/out/tail.txt || true
          git config user.name ci; git config user.email ci@example.com
          git checkout --orphan buildlogs
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/out/* .
          git add errors.txt tail.txt
          git commit -qm "log for ${GITHUB_SHA}"
          git push -f origin buildlogs
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: armsx2-android-v7a
          path: platforms/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
